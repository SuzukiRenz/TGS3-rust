services:
  tg-s3-bot:
    container_name: tgs3
    build: .
    image: tg-s3-bot:local
    restart: unless-stopped
    ports:
      - "8090:8090"
    env_file:
      - .env
    environment:
      - TGBOT_ADMINS=${TGBOT_ADMINS:-}   # comma-separated Telegram user IDs; empty = chat CLI disabled
    volumes:
      - /opt/tgs3/data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1770
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - tgs3_default

networks:
  tgs3_default:
    external: true
